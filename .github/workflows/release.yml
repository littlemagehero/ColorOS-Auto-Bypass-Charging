name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: grep -q "^version=${GITHUB_REF_NAME}" module.prop
      - name: Build zip, notes and update.json
        run: |
          V="${GITHUB_REF_NAME#v}"
          ZIP="ColorOS_Auto_Bypass_Charging_${GITHUB_REF_NAME}.zip"
          zip -r "$RUNNER_TEMP/$ZIP" . -x ".git/*" ".github/*"
          awk -v v="$V" '/^## \[/{p = index($0,"["v"]")>0; next} p' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          VER=$(grep '^version=' module.prop | cut -d= -f2)
          CODE=$(grep '^versionCode=' module.prop | cut -d= -f2)
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "%s",\n  "changelog": "%s"\n}\n' "$VER" "$CODE" "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP}" "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/CHANGELOG.md" > "$RUNNER_TEMP/update.json"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$GITHUB_REF_NAME" in v0.*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/ColorOS_Auto_Bypass_Charging_${GITHUB_REF_NAME}.zip" "$RUNNER_TEMP/update.json" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" $PRE
