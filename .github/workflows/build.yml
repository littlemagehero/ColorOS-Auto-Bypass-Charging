name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage module files
        run: |
          mkdir stage
          cp -r $(ls -A | grep -vE '^(\.git|\.github|stage)$') stage/
      - uses: actions/upload-artifact@v4
        with:
          name: ColorOS_Auto_Bypass_Charging-dev-${{ github.sha }}
          path: stage/
          retention-days: 14
